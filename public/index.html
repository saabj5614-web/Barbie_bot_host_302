<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barbie Hosting</title>
<style>body{margin:0;background:#090d18;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:22px}.box{max-width:1100px;margin:auto}.card{background:#121a2b;border:1px solid #263553;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{background:#0d1425;border:1px solid #263553;border-radius:14px;padding:16px}.value{font-size:25px;font-weight:800;margin-top:6px}.muted{color:#9ba8c5;font-size:13px}input,button{padding:12px;border-radius:10px;border:1px solid #34466e;background:#0d1425;color:#fff;margin:3px}button{cursor:pointer}.ok{color:#6ee7a8}.bad{color:#ff7b8a}.hidden{display:none}pre{white-space:pre-wrap;word-break:break-word}</style></head>
<body><div class="box"><h1 id="brand">Barbie Hosting</h1>
<section id="login" class="card"><h2>Owner Login</h2><input id="pw" type="password" placeholder="Owner password"><button onclick="login()">Login</button><p id="err"></p></section>
<section id="app" class="hidden"><div class="card"><button onclick="loadAll()">Refresh</button> <button onclick="logout()">Logout</button> <span class="muted" id="cap">Loading live resources…</span></div>
<div class="stats"><div class="stat"><div class="muted">Total Node RAM</div><div class="value" id="ramTotal">—</div></div><div class="stat"><div class="muted">Allocated RAM</div><div class="value" id="ramAllocated">—</div></div><div class="stat"><div class="muted">Available RAM</div><div class="value ok" id="ramAvailable">—</div></div><div class="stat"><div class="muted">Effective Capacity</div><div class="value" id="ramEffective">—</div></div></div>
<div class="card"><h2>Nodes</h2><div id="nodes" class="grid"></div></div><div class="card"><h2>Servers</h2><div id="servers" class="grid"></div></div>
<div class="card"><h2>Reseller / Customer Server</h2><p class="muted">Default RAM is 2 GB. Owner can choose the allocation for each customer server.</p><input id="email" placeholder="email"><input id="user" placeholder="username"><input id="first" placeholder="first name"><input id="last" placeholder="last name"><input id="ram" type="number" min="0" placeholder="RAM MB (default 2048)"><button onclick="createReseller()">Create</button><pre id="out"></pre></div></section></div>
<script>
const $=x=>document.getElementById(x); const gb=n=>{if(n===null||n===undefined)return 'Unlimited';return (Number(n||0)/1024).toFixed(2)+' GB'};
async function login(){try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});if(r.ok){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll()}else $('err').textContent='Wrong password'}catch(e){$('err').textContent=e.message}}
async function logout(){await fetch('/api/logout');location.reload()}
async function loadAll(){ $('cap').textContent='Reading live resources…'; try{let r=await fetch('/api/ptero?action=overview');let d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Connection failed');const s=d.data.summary;$('cap').innerHTML='<span class="ok">● Connected • Live API data</span>';$('ramTotal').textContent=s.unlimitedMemory?'Unlimited':gb(s.totalMemory);$('ramAllocated').textContent=gb(s.allocatedMemory);$('ramAvailable').textContent=s.unlimitedMemory?'Unlimited':gb(s.physicalAvailableMemory);$('ramEffective').textContent=s.unlimitedMemory?'Unlimited':gb(s.effectiveCapacity);
const nodes=d.data.nodes.data||[];$('nodes').innerHTML=nodes.map(n=>{const a=n.attributes||{},m=a.memory,d=a.disk;const mt=(m&&typeof m==='object')?m.total:m,dt=(d&&typeof d==='object')?d.total:d;const mu=Number(mt)>=4294967295,du=Number(dt)>=4294967295;return `<div class="card"><h3>${a.name||'Node'}</h3><p>RAM Total: <b>${mu?'Unlimited':gb(mt)}</b><br>RAM Allocation Limit: <b>${Number(a.memory_overallocate)===-1?'Unlimited':Number(a.memory_overallocate||0)+'%'}</b><br>Disk: <b>${du?'Unlimited':gb(dt)}</b><br>CPU: <b>${a.cpu==null?'N/A':Number(a.cpu)+'%'}</b></p></div>`}).join('')||'<div class="muted">No nodes returned.</div>';
const servers=d.data.servers.data||[];$('servers').innerHTML=servers.map(x=>{const a=x.attributes||{},l=a.limits||{};return `<div class="card"><h3>${a.name||'Server'}</h3><div class="muted">${a.status||'unknown'}</div><p>RAM: <b>${gb(l.memory)}</b><br>CPU: <b>${l.cpu??0}%</b></p></div>`}).join('')||'<div class="muted">No servers returned.</div>';
}catch(e){$('cap').innerHTML='<span class="bad">● Not connected: '+e.message+'</span>'}}
async function createReseller(){const ram=Number($('ram').value||2048);let body={email:$('email').value,username:$('user').value,firstName:$('first').value,lastName:$('last').value,server:{name:$('user').value+' Bot',memoryMB:ram}};let r=await fetch('/api/reseller',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('out').textContent=JSON.stringify(await r.json(),null,2);loadAll()}
fetch('/api/health').then(r=>r.json()).then(x=>$('brand').textContent=x.service||'Barbie Hosting');
</script></body></html>
