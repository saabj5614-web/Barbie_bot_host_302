<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Barbie Hosting</title><style>body{margin:0;background:#090d18;color:#fff;font-family:system-ui;padding:22px}.box{max-width:1000px;margin:auto}.card{background:#121a2b;border:1px solid #263553;border-radius:16px;padding:18px;margin:12px 0}input,button,select{padding:12px;border-radius:10px;border:1px solid #34466e;background:#0d1425;color:#fff}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.hidden{display:none}.muted{color:#9ba8c5}</style></head><body><div class=box><h1 id=brand>Barbie Hosting</h1><section id=login class=card><h2>Owner Login</h2><input id=pw type=password placeholder="Owner password"><button onclick=login()>Login</button><p id=err></p></section><section id=app class=hidden><div class=card><button onclick=loadAll()>Refresh</button> <button onclick=logout()>Logout</button><span class=muted id=cap></span></div><div id=servers class=grid></div><div class=card><h2>Reseller / Customer Server</h2><p class=muted>Provisioning requires Pterodactyl egg/location IDs and an authorized Application API key.</p><input id=email placeholder=email><input id=user placeholder=username><input id=first placeholder=first name><input id=last placeholder=last name><input id=ram placeholder="RAM MB (e.g. 2048)"><button onclick=createReseller()>Create</button><pre id=out></pre></div></section></div><script>
const $=x=>document.getElementById(x);async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});if(r.ok){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll()}else $('err').textContent='Wrong password'}async function logout(){await fetch('/api/logout');location.reload()}async function loadAll(){let r=await fetch('/api/ptero?action=servers');if(!r.ok){$('cap').textContent='Not connected';return}let d=await r.json();$('servers').innerHTML=(d.data.data||[]).map(s=>`<div class=card><h3>${s.attributes.name}</h3><div class=muted>${s.attributes.status||'unknown'}</div><p>RAM: ${s.attributes.limits.memory} MB<br>CPU: ${s.attributes.limits.cpu}%</p><button onclick="power('${s.attributes.identifier}','start')">Start</button><button onclick="power('${s.attributes.identifier}','restart')">Restart</button><button onclick="power('${s.attributes.identifier}','stop')">Stop</button></div>`).join('')}async function power(id,signal){await fetch('/api/ptero?action=power',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,signal})});loadAll()}async function createReseller(){let body={email:$('email').value,username:$('user').value,firstName:$('first').value,lastName:$('last').value,server:{name:$('user').value+' Bot',memoryMB:Number($('ram').value||2048)}};let r=await fetch('/api/reseller',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('out').textContent=JSON.stringify(await r.json(),null,2)}fetch('/api/health').then(r=>r.json()).then(x=>$('brand').textContent=x.service||'Barbie Hosting');</script></body></html>
