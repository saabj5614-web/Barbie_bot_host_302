<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Barbie Hosting</title><style>body{margin:0;background:#090d18;color:#fff;font-family:system-ui;padding:16px}.box{max-width:1100px;margin:auto}.card{background:#121a2b;border:1px solid #263553;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.muted{color:#9ba8c5;font-size:13px}.ok{color:#62e6ad}.warn{color:#ffd166}input,button{padding:11px;border-radius:9px;border:1px solid #34466e;background:#0d1425;color:#fff}button{cursor:pointer;margin:3px}.hidden{display:none}.metric{font-size:22px;font-weight:700;margin-top:5px}.node{padding:13px;border:1px solid #263553;border-radius:13px;margin-top:10px}.server{padding:14px;border:1px solid #263553;border-radius:13px}.bar{height:7px;background:#202b43;border-radius:9px;overflow:hidden}.fill{height:100%;background:#62e6ad}.err{color:#ff7777}</style></head><body><div class=box><h1 id=brand>Barbie Hosting</h1><section id=login class=card><h2>Owner Login</h2><input id=pw type=password placeholder="Owner password"><button onclick=login()>Login</button><p id=err></p></section><section id=app class=hidden><div class=card><button onclick=loadAll()>Refresh</button><button onclick=logout()>Logout</button><span id=cap class=muted></span></div><div id=metrics class=grid></div><div class=card><h2>Nodes</h2><div id=nodes></div></div><div class=card><h2>Servers</h2><div id=servers class=grid></div></div><div class=card><h2>Reseller / Customer Server</h2><p class=muted>Provisioning uses your authorized hosting API.</p><input id=email placeholder=email><input id=user placeholder=username><input id=first placeholder=first name><input id=last placeholder=last name><input id=ram placeholder="RAM MB"><button onclick=createReseller()>Create</button><pre id=out></pre></div></section></div><script>const $=x=>document.getElementById(x);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});if(r.ok){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll()}else $('err').textContent='Wrong password'}async function logout(){await fetch('/api/logout');location.reload()}function gb(m){return (Number(m||0)/1024).toFixed(2)}async function loadAll(){const r=await fetch('/api/ptero?action=dashboard');if(!r.ok){let e={};try{e=await r.json()}catch{}$('cap').innerHTML='<span class=err>Connection error: '+esc(e.error||r.status)+'</span>';return}const d=await r.json(),nodes=d.nodes?.data||[],servers=d.servers?.data||[];let total=0,alloc=0,effective=0;nodes.forEach(n=>{const a=n.attributes||{},m=a.memory||{};const t=Number(m.total||0),o=Number(m.overallocate||0);total+=t;effective+=t*(1+o/100)});servers.forEach(s=>alloc+=Number(s.attributes?.limits?.memory||0));const available=Math.max(effective-alloc,0);$('cap').innerHTML='<span class=ok>● Connected · Live API data</span>';$('metrics').innerHTML='<div class=card><div class=muted>Total Node RAM</div><div class=metric>'+gb(total)+' GB</div></div><div class=card><div class=muted>Allocated RAM</div><div class=metric>'+gb(alloc)+' GB</div></div><div class=card><div class=muted>Available Capacity</div><div class="metric ok">'+gb(available)+' GB</div></div><div class=card><div class=muted>Effective Capacity</div><div class=metric>'+gb(effective)+' GB</div></div>';$('nodes').innerHTML=nodes.map(n=>{const a=n.attributes||{},m=a.memory||{},c=a.disk||{},cpu=a.cpu||{};const t=Number(m.total||0),o=Number(m.overallocate||0),eff=t*(1+o/100);const used=servers.filter(s=>Number(s.attributes?.node)===Number(a.id)).reduce((x,s)=>x+Number(s.attributes?.limits?.memory||0),0);const left=Math.max(eff-used,0);return '<div class=node><b>'+esc(a.name||'Node')+'</b><p class=muted>RAM capacity: '+gb(t)+' GB · allocated: '+gb(used)+' GB · available: '+gb(left)+' GB</p><div class=bar><div class=fill style="width:'+Math.min(100,t?used/t*100:0)+'%"></div></div><p class=muted>RAM overallocate: '+Number(m.overallocate||0)+'% · Disk: '+gb(c.total||0)+' GB · CPU: '+Number(cpu.total||0)+'%</p></div>'}).join('')||'<p class=muted>No nodes returned.</p>';$('servers').innerHTML=servers.map(s=>{const a=s.attributes||{};return '<div class=server><h3>'+esc(a.name||'Server')+'</h3><div class=muted>'+esc(a.status||'unknown')+'</div><p>RAM: '+gb(a.limits?.memory||0)+' GB<br>CPU: '+Number(a.limits?.cpu||0)+'%</p><button onclick="power(\''+esc(a.identifier)+"\','start')">Start</button><button onclick="power(\''+esc(a.identifier)+"\','restart')">Restart</button><button onclick="power(\''+esc(a.identifier)+"\','stop')">Stop</button></div>'}).join('')||'<p class=muted>No servers returned.</p>'}async function power(id,signal){await fetch('/api/ptero?action=power',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,signal})});loadAll()}async function createReseller(){let body={email:$('email').value,username:$('user').value,firstName:$('first').value,lastName:$('last').value,server:{name:$('user').value+' Bot',memoryMB:Number($('ram').value||2048)}};let r=await fetch('/api/reseller',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('out').textContent=JSON.stringify(await r.json(),null,2)}fetch('/api/health').then(r=>r.json()).then(x=>$('brand').textContent=x.service||'Barbie Hosting');</script></body></html>
