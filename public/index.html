<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barbie Hosting</title>
<style>
body{margin:0;background:#090d18;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:16px}.box{max-width:1100px;margin:auto}.card{background:#121a2b;border:1px solid #263553;border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.muted{color:#9ba8c5;font-size:13px}.ok{color:#62e6ad}.err{color:#ff7777}.warn{color:#ffd166}.metric{font-size:22px;font-weight:700;margin-top:5px}.node,.server{padding:14px;border:1px solid #263553;border-radius:13px;margin-top:10px}.bar{height:7px;background:#202b43;border-radius:9px;overflow:hidden}.fill{height:100%;background:#62e6ad;width:0}input,button{padding:11px;border-radius:9px;border:1px solid #34466e;background:#0d1425;color:#fff}button{cursor:pointer;margin:3px}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.status{margin-left:8px}
</style>
</head>
<body>
<div class="box">
<h1 id="brand">Barbie Hosting</h1>
<section id="login" class="card">
<h2>Owner Login</h2>
<div class="row"><input id="pw" type="password" placeholder="Owner password"><button id="loginBtn">Login</button></div>
<p id="err" class="err"></p>
</section>
<section id="app" class="hidden">
<div class="card"><button id="refreshBtn">Refresh</button><button id="logoutBtn">Logout</button><span id="cap" class="status muted"></span></div>
<div id="metrics" class="grid"></div>
<div class="card"><h2>Nodes</h2><div id="nodes"></div></div>
<div class="card"><h2>Servers</h2><div id="servers" class="grid"></div></div>
<div class="card"><h2>Reseller / Customer Server</h2><p class="muted">Provisioning uses your authorized hosting API.</p>
<div class="row"><input id="email" placeholder="email"><input id="user" placeholder="username"><input id="first" placeholder="first name"><input id="last" placeholder="last name"><input id="ram" placeholder="RAM MB"><button id="createBtn">Create</button></div>
<pre id="out"></pre></div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function gb(m){return (Number(m||0)/1024).toFixed(2);}

async function login(){
  const password=$('pw').value;
  $('err').textContent='';
  if(!password){$('err').textContent='Password required';return;}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
    if(!r.ok){let e={};try{e=await r.json();}catch{} $('err').textContent=e.error||'Wrong password';return;}
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    await loadAll();
  }catch(e){$('err').textContent='Login request failed';}
}

async function logout(){try{await fetch('/api/logout');}finally{location.reload();}}

function nodeMemory(attrs){
  const m=attrs?.memory;
  if(typeof m==='number') return m;
  if(typeof m==='string') return Number(m)||0;
  if(m && typeof m==='object') return Number(m.total||m.memory||0);
  return Number(attrs?.memory_total||attrs?.total_memory||0);
}
function nodeOverallocate(attrs){
  const m=attrs?.memory;
  if(m && typeof m==='object') return Number(m.overallocate||0);
  return Number(attrs?.memory_overallocate||attrs?.overallocate||0);
}
function nodeDisk(attrs){
  const d=attrs?.disk;
  if(typeof d==='number') return d;
  if(d && typeof d==='object') return Number(d.total||0);
  return Number(attrs?.disk_total||0);
}
function nodeCpu(attrs){
  const c=attrs?.cpu;
  if(typeof c==='number') return c;
  if(c && typeof c==='object') return Number(c.total||0);
  return Number(attrs?.cpu_total||0);
}

async function loadAll(){
  $('cap').textContent='Loading…';
  try{
    const r=await fetch('/api/ptero?action=dashboard',{cache:'no-store'});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok){$('cap').innerHTML='<span class="err">Connection error: '+esc(d.error||r.status)+'</span>';return;}
    const nodes=Array.isArray(d.nodes?.data)?d.nodes.data:[];
    const servers=Array.isArray(d.servers?.data)?d.servers.data:[];
    let total=0,alloc=0,effective=0;
    nodes.forEach(n=>{const a=n.attributes||{};const t=nodeMemory(a);const o=nodeOverallocate(a);total+=t;effective+=t*(1+o/100);});
    servers.forEach(s=>{alloc+=Number(s.attributes?.limits?.memory||0);});
    const available=Math.max(effective-alloc,0);
    $('cap').innerHTML='<span class="ok">● Connected · Live API data</span>';
    $('metrics').innerHTML='<div class="card"><div class="muted">Total Node RAM</div><div class="metric">'+gb(total)+' GB</div></div><div class="card"><div class="muted">Allocated RAM</div><div class="metric">'+gb(alloc)+' GB</div></div><div class="card"><div class="muted">Available Capacity</div><div class="metric ok">'+gb(available)+' GB</div></div><div class="card"><div class="muted">Effective Capacity</div><div class="metric">'+gb(effective)+' GB</div></div>';
    $('nodes').innerHTML=nodes.map(n=>{
      const a=n.attributes||{},t=nodeMemory(a),o=nodeOverallocate(a),eff=t*(1+o/100),used=servers.filter(s=>Number(s.attributes?.node)===Number(a.id)).reduce((x,s)=>x+Number(s.attributes?.limits?.memory||0),0),left=Math.max(eff-used,0),disk=nodeDisk(a),cpu=nodeCpu(a),pct=t?Math.min(100,used/t*100):0;
      return '<div class="node"><b>'+esc(a.name||'Node')+'</b><p class="muted">RAM capacity: '+gb(t)+' GB · allocated: '+gb(used)+' GB · available: '+gb(left)+' GB</p><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><p class="muted">RAM overallocate: '+o+'% · Disk: '+gb(disk)+' GB · CPU: '+cpu+'%</p></div>';
    }).join('')||'<p class="muted">No nodes returned.</p>';
    $('servers').innerHTML=servers.map(s=>{
      const a=s.attributes||{};const wrap=document.createElement('div');wrap.className='server';wrap.innerHTML='<h3>'+esc(a.name||'Server')+'</h3><div class="muted">'+esc(a.status||'unknown')+'</div><p>RAM: '+gb(a.limits?.memory||0)+' GB<br>CPU: '+Number(a.limits?.cpu||0)+'%</p>';
      const buttons=['start','restart','stop'].map(sig=>{const b=document.createElement('button');b.textContent=sig[0].toUpperCase()+sig.slice(1);b.addEventListener('click',()=>power(a.identifier,sig));return b;});buttons.forEach(b=>wrap.appendChild(b));return wrap.outerHTML;
    }).join('')||'<p class="muted">No servers returned.</p>';
  }catch(e){$('cap').innerHTML='<span class="err">Connection failed</span>';}
}

async function power(id,signal){
  try{await fetch('/api/ptero?action=power',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,signal})});}finally{loadAll();}
}
async function createReseller(){
  const body={email:$('email').value,username:$('user').value,firstName:$('first').value,lastName:$('last').value,server:{name:$('user').value+' Bot',memoryMB:Number($('ram').value||2048)}};
  const r=await fetch('/api/reseller',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('out').textContent=JSON.stringify(await r.json().catch(()=>({})),null,2);
}
$('loginBtn').addEventListener('click',login);
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
$('refreshBtn').addEventListener('click',loadAll);
$('logoutBtn').addEventListener('click',logout);
$('createBtn').addEventListener('click',createReseller);
fetch('/api/health').then(r=>r.json()).then(x=>{$('brand').textContent=x.service||'Barbie Hosting';}).catch(()=>{});
</script>
</body>
                                                                                                  </html>
